name: newcar
description: FloodGuard — ứng dụng bảo vệ ô tô trước ngập lụt
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.1.0
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  flutter_map_cancellable_tile_provider: ^3.0.2
  flutter_blue_plus: ^1.31.0
  wifi_scan: ^0.4.0+1
  intl: ^0.20.2
  rxdart: ^0.28.0
  flutter_tts: ^4.2.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.4
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  flutter_animate: ^4.5.2

dependency_overrides:
  path_provider_foundation: 2.4.0
  path_provider_android: 2.2.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
